<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Livvic:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/normalize.css" />
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="stylesheet" href="../CSS/contact.css" />
    <title>Frontend Mentor | myteam website challenge - Contact</title>
  </head>
  <body>
    <div id="container">
      <header class="body-1">
        <nav>
          <ul>
            <li>
              <img src="../assets/logo.svg" alt="logo" />
            </li>
            <ul>
              <li>
                <a href="../index.html">home</a>
              </li>
              <li>
                <a href="../pages/about.html">about</a>
              </li>
            </ul>
          </ul>
          <button class="body-1">
            <a href="../pages/contact.html">contact us</a>
          </button>
        </nav>
      </header>
      <main>
        <section>
          <article>
            <h1 class="h1-small">Contact</h1>
            <h2 class="h3">Ask us about</h2>
            <article>
              <img src="../assets/icon-person.svg" alt="person icon" />
              <p class="body-1">The quality of our talent network</p>
            </article>
            <article>
              <img src="../assets/icon-cog.svg" alt="cog icon" />
              <p class="body-1">Usage & implementation of our software</p>
            </article>
            <article>
              <img src="../assets/icon-chart.svg" alt="chart icon" />
              <p class="body-1">How we help drive innovation</p>
            </article>
          </article>
          <form action="#" method="get">
            <input type="text" placeholder="Name" />
            <input type="text" placeholder="Email Address" />
            <input type="text" placeholder="Company Name" />
            <input type="text" placeholder="Title " />
            <input type="text" placeholder="Message" />
            <input type="submit" value="submit" />
          </form>
          <img
            class="first-circle"
            src="../assets/bg-pattern-about-2-contact-1.svg"
            alt="picture of a circle"
          />
          <img
            class="second-circle"
            src="../assets/bg-pattern-contact-2.svg"
            alt="picture of a circle"
          />
        </section>
      </main>

      <footer id="footer">
        <div>
          <div class="logo">
            <img src="../assets/logo.svg" alt="logo" />
            <ul class="=body-1">
              <li>
                <a href="../index.html">home</a>
              </li>
              <li>
                <a href="../pages/about.html">about</a>
              </li>
            </ul>
          </div>
          <address class="body-2">
            <ul>
              <li>987 Hillcrest Lane</li>
              <li>Irvine, CA</li>
              <li>California 92714</li>
              <li>Call Us : 949-833-7432</li>
            </ul>
          </address>
        </div>
        <div class="social">
          <ul>
            <li>
              <a href="#">
                <img src="../assets/icon-facebook.svg" alt="Facebook" />
              </a>
            </li>
            <li>
              <a href="#">
                <img src="../assets/icon-pinterest.svg" alt="Pinterest" />
              </a>
            </li>
            <li>
              <a href="#">
                <img src="../assets/icon-twitter.svg" alt="Twitter" />
              </a>
            </li>
          </ul>
          <p class="body-2">Copyright 2020. All Rights Reserved</p>
        </div>
      </footer>
    </div>
  </body>
</html>
